ProjectName=Third Person BP Game Template

[Staging]
; Character/Android is our android character, not the Android platform
+AllowedDirectories=visex/Content/Character/Android

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToNeverCook=(Path="/MovieRenderPipeline")
; the game loads outfits, poses, menu/photo animations and UI materials by path from C++,
; which the cooker can't see from Lvl_Dust: cook these folders whole
+DirectoriesToAlwaysCook=(Path="/Game/Character")
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
+DirectoriesToAlwaysCook=(Path="/Game/VisEx")

[/Script/MoviePlayer.MoviePlayerSettings]
; the intro film (Content/Movies/VisexIntro.mp4, staged as a loose file), at launch only. It
; ends on black; VisexLaunchCover holds black until the menu has settled, then fades it up
bWaitForMoviesToComplete=True
bMoviesAreSkippable=True
+StartupMovies=VisexIntro

[/Script/visex.VisexLaunchCover]
; no still: solid black (0,0,0) from the film's end until the menu settles, then the live scene
; fades up from it while she walks in. A /Game texture path or an image under Content/ (e.g.
; Movies/VisexIntro_last.png) brings back the still and its cross-fade.
CoverImage=
CoverColor=(R=0.0,G=0.0,B=0.0,A=1.0)
FadeTime=1.5
; then the menu panel fades in (her arrival fades it in itself, during her walk)
PanelFadeTime=0.8
; the 7 s film carries MUS_UnopenedGate 0-7 s: the live music picks up at 7 s, full volume,
; no fade, on the first frame after the film (in the black). 0: it fades in with the fade
LaunchMusicOffset=7.0
