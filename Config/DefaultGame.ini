[/Script/MoviePlayer.MoviePlayerSettings]
; the intro film (Content/Movies/VisexIntro.mp4, staged as a loose file), at launch only. It
; ends on the live menu shot; VisexLaunchCover holds its last frame until the menu has settled
bWaitForMoviesToComplete=True
bMoviesAreSkippable=True
+StartupMovies=VisexIntro

[/Script/visex.VisexLaunchCover]
; the film's last frame (3840x2400, 16:10, no menu panel), held until the menu settles, then cross-faded into it.
; A /Game texture path, or an image file under Content/ (Content/Movies is staged as files)
CoverImage=Movies/VisexIntro_last.png
FadeTime=0.8
; then the menu panel (not in the film) fades in
PanelFadeTime=0.8
; seconds of the soundtrack the film carries: the live music picks up there at the film's end.
; 0: the music starts from its top, fading in with the cross-fade
LaunchMusicOffset=0
