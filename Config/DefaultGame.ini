ProjectName=Third Person BP Game Template

[Staging]
; Character/Android is our android character, not the Android platform
+AllowedDirectories=visex/Content/Character/Android

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToNeverCook=(Path="/MovieRenderPipeline")
; the intro film, played from a loose file (VisexLaunchCover)
+DirectoriesToAlwaysStageAsNonUFS=(Path="Movies")
; the game loads outfits, poses, menu/photo animations and UI materials by path from C++,
; which the cooker can't see from Lvl_Dust: cook these folders whole
+DirectoriesToAlwaysCook=(Path="/Game/Character")
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
+DirectoriesToAlwaysCook=(Path="/Game/VisEx")
; Ship 1 (the MetaHuman body). /Game/Character is cooked whole, and three things under MH must stay out:
; - the Creator asset: editor-side only, and cooked it drags 1 GB of the plugin's optional wardrobe
;   (/MetaHumanCharacter/Optional) into the build;
; - the face-fit template meshes (Tools/mh_face_fit.py's input);
; - the preset's old groom binding, unreferenced since stage 5: it cannot be rebuilt ("no valid skel./geom
;   cache target") and fails the cook with 4 errors.
; An entry may name one package: the cooker matches the path itself or a parent.
+DirectoriesToNeverCook=(Path="/Game/Character/MH/MHC_Her")
+DirectoriesToNeverCook=(Path="/Game/Character/MH/FaceFit")
+DirectoriesToNeverCook=(Path="/Game/Character/MH/Built/MHC_Her/Grooms/Hair_S_Coil_Binding")

[/Script/visex.VisexLaunchCover]
; the intro film plays in-game (UVisexLaunchCover: MediaPlayer + MediaTexture, AvfMedia on Mac)
; as soon as Lvl_Dust is up, while the scene warms up behind it; no startup movie. It ends on
; black and the live scene fades up from black at once (black holds only if the scene isn't
; settled yet). The music starts from its top with the film (the film's own sound is muted).
FilmPath=Movies/VisexIntro.mp4
FilmSize=(X=3840.0,Y=2400.0)
FadeTime=1.5
; then the menu panel fades in (her arrival fades it in itself, during her walk)
PanelFadeTime=0.8

